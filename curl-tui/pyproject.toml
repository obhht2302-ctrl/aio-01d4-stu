[project]
name = "curl-tui"
version = "0.1.0"
description = "A small Textual interface for curl"
requires-python = ">=3.10"
dependencies = ["textual>=0.58"]

[project.scripts]
curl-tui = "curl_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curl_tui"]
